# =============================================================================
# backup_notifier config (INI format)
# Copy this file to my_config.ini and fill in your values.
# Nothing sensitive belongs in here directly — the SMTP password comes
# from an environment variable, not this file. See README.md.
# =============================================================================

[job]
# Friendly name used in the email subject and report heading
name = Nightly Backup Job

# The script that does the actual backup work. It must print the path
# to a JSON status file as the LAST LINE of stdout when it finishes.
# See epm_level0_backup.sh for the expected JSON shape.
backup_script = /path/to/your/backup_script.sh

[email]
enabled = true

from_address = backups@example.com

# Comma-separated list of recipients
to_addresses = you@example.com

# Comma-separated list, or leave blank for none. Don't repeat an
# address that's already in to_addresses — most email providers reject
# a message where the same recipient shows up in both To and Cc.
cc_addresses =

subject_prefix = [Backup]

[smtp]
# ---------------------------------------------------------------------
# Two common setups:
#
# 1) INTERNAL RELAY (typical in an organization): a Linux/Windows
#    server sends through your org's internal SMTP relay — usually
#    allow-listed by server IP/hostname rather than a login, running
#    on port 25 with no TLS since it never leaves the internal network.
#    Ask your infra/network team for the relay's hostname if you don't
#    already know it (often something like smtp-relay.yourcompany.com
#    or an internal IP).
#
#       host          = smtp-relay.yourcompany.com
#       port          = 25
#       use_tls       = false
#       auth_required = false
#       (username, password_env_var, and password are all ignored
#        when auth_required = false)
#
# 2) DIRECT AUTHENTICATED SEND (personal Gmail, Office365 direct,
#    or any provider that requires a real login): see the Gmail/
#    Office365 examples further down.
#
#       host          = smtp.office365.com
#       port          = 587
#       use_tls       = true
#       auth_required = true
# ---------------------------------------------------------------------

host = smtp.gmail.com
port = 587
use_tls = true

# true  = log in with username/password (Gmail, Office365 direct, etc)
# false = connect and send with no login (internal relay server)
auth_required = true

username = you@example.com

# The password itself is NEVER stored in this file. Set it as an
# environment variable before running the script:
#
#   export BACKUP_NOTIFIER_SMTP_PASSWORD="your-app-password"
#
# For Gmail you need an "App Password" (not your normal login password) —
# generate one at https://myaccount.google.com/apppasswords
#
# Ignored entirely when auth_required = false.
password_env_var = BACKUP_NOTIFIER_SMTP_PASSWORD

# LOCAL TESTING ONLY: you can instead type the password directly here
# to skip the environment-variable step. If this is set, it's used
# instead of password_env_var above. Also ignored when
# auth_required = false.
#
#   *** DO NOT commit this file or paste it into a blog post/repo with
#   *** this value filled in. Delete it again once you're done testing,
#   *** or keep this file entirely out of version control.
#
# password =

[retention]
# Purely cosmetic — shown in the report. Your backup script decides
# what actually gets purged and how.
days = 90
